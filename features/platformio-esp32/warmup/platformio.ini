; Aufwaermprojekt: laedt Plattformen, Toolchains und IDF-Python-Umgebungen ins Image. Die Versionen muessen zu den
; Projekten passen, die in diesem Image bauen (webradio-s3-epaper/platformio.ini).
[env]
framework = espidf
build_flags = -Wno-error=unused-const-variable

[env:s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1

[env:c6]
platform = espressif32@6.12.0
board = esp32-c6-devkitc-1

[env:p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32-p4_r3
